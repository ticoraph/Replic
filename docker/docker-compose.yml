services:
  pgvector:
    image: pgvector/pgvector:pg15  # Postgres 15
    container_name: pulpfictionchatbot-pgvector
    environment:
      POSTGRES_USER: pulpfiction
      POSTGRES_PASSWORD: pulpfiction
      POSTGRES_DB: pulpfictionchatbot
    ports:
      - "5434:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql/data
      - ../embeddings/pgvector/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulpfiction -d pulpfictionchatbot"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgvector_data:
